<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>myPlayer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="open-file-btn" type="button" title="打开音频文件">打开文件</button>
      </header>
      <main id="playlist-area">
        <p id="playlist-hint" class="hint">点击右上角「打开文件」选择 MP3 开始播放</p>
      </main>
      <footer id="player-bar">
        <div class="progress-row">
          <span id="current-time" class="time">00:00</span>
          <input id="seek-bar" type="range" min="0" max="0" step="0.1" value="0" disabled />
          <span id="duration" class="time">00:00</span>
        </div>
        <div class="control-row">
          <button id="play-btn" type="button" title="播放 / 暂停（空格）" disabled>
            <svg id="icon-play" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
              <path d="M4 2l10 6-10 6z" fill="currentColor" />
            </svg>
            <svg id="icon-pause" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
              <path d="M3 2h4v12H3zM9 2h4v12H9z" fill="currentColor" />
            </svg>
          </button>
          <div class="volume-group">
            <button id="mute-btn" type="button" title="静音（M）">
              <svg id="icon-volume" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path d="M2 6v4h3l4 3V3L5 6z" fill="currentColor" />
                <path d="M11 5.5a3.5 3.5 0 010 5" stroke="currentColor" fill="none" stroke-width="1.5" />
              </svg>
              <svg id="icon-muted" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path d="M2 6v4h3l4 3V3L5 6z" fill="currentColor" />
                <path d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.5" />
              </svg>
            </button>
            <input id="volume-bar" type="range" min="0" max="100" step="1" value="100" />
          </div>
          <button id="rate-btn" type="button" title="播放速度">1.0x</button>
        </div>
      </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
