<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>myPlayer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <button id="add-btn" type="button" title="添加 MP3 文件（⌘O）">添加</button>
        <button id="remove-btn" type="button" title="删除当前曲目" disabled>删除</button>
        <button id="clear-btn" type="button" title="清空列表" disabled>清空</button>
      </header>
      <main id="main-row">
        <section id="playlist-area">
          <p id="playlist-hint" class="hint">拖入 MP3 或按 ⌘O 打开</p>
          <ol id="playlist"></ol>
        </section>
        <section id="transcript-area">
          <header class="transcript-header">
            <span class="transcript-title">转录文稿</span>
            <button id="retranscribe-btn" type="button" disabled>重新转录</button>
          </header>
          <div id="transcript-body"></div>
        </section>
      </main>
      <footer id="player-bar">
        <div class="progress-row">
          <span id="current-time" class="time">00:00</span>
          <input id="seek-bar" type="range" min="0" max="0" step="0.1" value="0" disabled />
          <span id="duration" class="time">00:00</span>
        </div>
        <div class="control-row">
          <button id="prev-btn" type="button" title="上一首（⌘←）">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M3 2h2v12H3zM13 2v12L5.5 8z" fill="currentColor" />
            </svg>
          </button>
          <button id="play-btn" type="button" title="播放 / 暂停（空格）" disabled>
            <svg id="icon-play" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
              <path d="M4 2l10 6-10 6z" fill="currentColor" />
            </svg>
            <svg id="icon-pause" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
              <path d="M3 2h4v12H3zM9 2h4v12H9z" fill="currentColor" />
            </svg>
          </button>
          <button id="next-btn" type="button" title="下一首（⌘→）">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path d="M11 2h2v12h-2zM3 2v12l7.5-6z" fill="currentColor" />
            </svg>
          </button>
          <div class="volume-group">
            <button id="mute-btn" type="button" title="静音（M）">
              <svg id="icon-volume" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path d="M2 6v4h3l4 3V3L5 6z" fill="currentColor" />
                <path d="M11 5.5a3.5 3.5 0 010 5" stroke="currentColor" fill="none" stroke-width="1.5" />
              </svg>
              <svg id="icon-muted" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
                <path d="M2 6v4h3l4 3V3L5 6z" fill="currentColor" />
                <path d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.5" />
              </svg>
            </button>
            <input id="volume-bar" type="range" min="0" max="100" step="1" value="100" />
          </div>
          <button id="rate-btn" type="button" title="播放速度">1.0x</button>
          <button id="loop-btn" type="button" title="循环模式（L）">列表循环</button>
        </div>
      </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
